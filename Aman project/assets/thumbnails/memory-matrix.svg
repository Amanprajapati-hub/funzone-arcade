<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mmBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>
    <linearGradient id="activeNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mmBg)"/>

  <!-- Circuit lines in background -->
  <path d="M50,150 L120,150 L160,200 L250,200" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <path d="M450,200 L500,200 L540,250 L580,250" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <circle cx="50" cy="150" r="4" fill="#00f0ff" opacity="0.6"/>
  <circle cx="580" cy="250" r="4" fill="#00f0ff" opacity="0.6"/>

  <!-- 3x3 Memory Node Grid -->
  <g transform="translate(180, 80)">
    <!-- Node 1 (Off) -->
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="35" cy="35" r="12" fill="#1e3a5f"/>

    <!-- Node 2 (ACTIVE LIT - glowing) -->
    <rect x="85" y="0" width="70" height="70" rx="14" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
    <circle cx="120" cy="35" r="18" fill="#ffffff" opacity="0.9"/>
    <!-- Shockwave ring -->
    <rect x="80" y="-5" width="80" height="80" rx="18" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>

    <!-- Node 3 (Off) -->
    <rect x="170" y="0" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="205" cy="35" r="12" fill="#1e3a5f"/>

    <!-- Node 4 (Off) -->
    <rect x="0" y="85" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="35" cy="120" r="12" fill="#1e3a5f"/>

    <!-- Node 5 (Off) -->
    <rect x="85" y="85" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="120" cy="120" r="12" fill="#1e3a5f"/>

    <!-- Node 6 (ACTIVE LIT - glowing Magenta) -->
    <rect x="170" y="85" width="70" height="70" rx="14" fill="#ff007f" stroke="#ffffff" stroke-width="3"/>
    <circle cx="205" cy="120" r="18" fill="#ffffff" opacity="0.9"/>
    <rect x="165" y="80" width="80" height="80" rx="18" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.6"/>

    <!-- Node 7 (ACTIVE LIT - glowing Yellow) -->
    <rect x="0" y="170" width="70" height="70" rx="14" fill="#ffe600" stroke="#ffffff" stroke-width="3"/>
    <circle cx="35" cy="205" r="18" fill="#ffffff" opacity="0.9"/>

    <!-- Node 8 (Off) -->
    <rect x="85" y="170" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="120" cy="205" r="12" fill="#1e3a5f"/>

    <!-- Node 9 (Off) -->
    <rect x="170" y="170" width="70" height="70" rx="14" fill="#0f213a" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="205" cy="205" r="12" fill="#1e3a5f"/>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#a855f7" stroke-width="1.5"/>
  <text x="32" y="43" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">PUZZLE</text>
</svg>
