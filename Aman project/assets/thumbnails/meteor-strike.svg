<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="meteorBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#150821"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2a54"/>
      <stop offset="100%" stop-color="#1b1226"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#meteorBg)"/>

  <!-- Distant Stars & Dust -->
  <circle cx="95" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="510" cy="140" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="430" cy="340" r="1.5" fill="#ffe600" opacity="0.7"/>

  <!-- Giant Meteor with glowing cracks -->
  <g transform="translate(370, 70)">
    <polygon points="50,10 110,30 140,80 120,130 60,150 15,110 5,60" fill="url(#rockGrad)" stroke="#ff007f" stroke-width="2.5"/>
    <!-- Glowing fissures -->
    <path d="M50,10 L70,55 L60,95 L60,150 M70,55 L110,65" stroke="#ff007f" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="45" cy="70" r="6" fill="#150821"/>
    <circle cx="90" cy="100" r="10" fill="#150821"/>
  </g>

  <!-- Exploding / Fracturing Asteroid Shards -->
  <polygon points="320,180 340,165 355,185 335,195" fill="#ff007f" opacity="0.9"/>
  <polygon points="360,210 375,195 385,215 370,225" fill="#ff7700" opacity="0.8"/>
  <circle cx="345" cy="190" r="2" fill="#ffffff"/>
  <circle cx="370" cy="205" r="3" fill="#ffe600"/>

  <!-- Blaster Shot Rays -->
  <line x1="205" y1="265" x2="330" y2="195" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="260" x2="325" y2="190" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Vector Player Ship (Rotated facing top-right) -->
  <g transform="translate(170, 260) rotate(25)">
    <!-- Shield glow circle -->
    <circle cx="0" cy="0" r="38" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Thruster Flame -->
    <polygon points="-8,25 0,42 8,25" fill="#ff7700"/>
    <polygon points="-4,25 0,36 4,25" fill="#ffe600"/>
    <!-- Triangular Ship -->
    <polygon points="0,-30 22,22 0,14 -22,22" fill="#111827" stroke="#00f0ff" stroke-width="3"/>
    <!-- Cockpit Core -->
    <circle cx="0" cy="-2" r="5" fill="#00f0ff"/>
  </g>

  <!-- Smaller floating meteor in background -->
  <polygon points="90,160 120,145 135,175 110,195 80,180" fill="url(#rockGrad)" stroke="#7928ca" stroke-width="1.5"/>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#ff007f" stroke-width="1.5"/>
  <text x="32" y="43" fill="#ff007f" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">ACTION</text>
</svg>
