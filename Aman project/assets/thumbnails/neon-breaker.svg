<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#nbBg)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#1f293d" stroke-width="1"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#1f293d" stroke-width="1"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#1f293d" stroke-width="1"/>

  <!-- Bricks Row 1 - Magenta -->
  <rect x="50" y="70" width="90" height="26" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="150" y="70" width="90" height="26" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="250" y="70" width="90" height="26" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="350" y="70" width="90" height="26" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="450" y="70" width="90" height="26" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Bricks Row 2 - Cyan -->
  <rect x="50" y="106" width="90" height="26" rx="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="150" y="106" width="90" height="26" rx="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="250" y="106" width="90" height="26" rx="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <!-- (350 is broken/cleared) -->
  <rect x="450" y="106" width="90" height="26" rx="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Bricks Row 3 - Gold -->
  <rect x="50" y="142" width="90" height="26" rx="6" fill="#ffe600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="150" y="142" width="90" height="26" rx="6" fill="#ffe600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="250" y="142" width="90" height="26" rx="6" fill="#ffe600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="350" y="142" width="90" height="26" rx="6" fill="#ffe600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <rect x="450" y="142" width="90" height="26" rx="6" fill="#ffe600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Ball Trail and Glowing Energy Ball -->
  <line x1="280" y1="330" x2="350" y2="200" stroke="#ffe600" stroke-width="2" stroke-dasharray="4,6" opacity="0.5"/>
  <circle cx="350" cy="195" r="14" fill="url(#ballGlow)"/>
  <circle cx="350" cy="195" r="22" fill="#ffe600" opacity="0.25"/>

  <!-- Shatter fragments where brick broke -->
  <rect x="360" y="110" width="8" height="8" fill="#00f0ff" transform="rotate(25 360 110)"/>
  <rect x="375" y="125" width="6" height="6" fill="#00f0ff" transform="rotate(45 375 125)"/>
  <rect x="390" y="105" width="9" height="7" fill="#00f0ff" transform="rotate(15 390 105)"/>

  <!-- Player Energy Paddle -->
  <g transform="translate(200, 340)">
    <rect x="0" y="0" width="160" height="20" rx="10" fill="#1e293b" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="20" y="4" width="120" height="12" rx="6" fill="#00f0ff"/>
    <circle cx="20" cy="10" r="5" fill="#ff007f"/>
    <circle cx="140" cy="10" r="5" fill="#ff007f"/>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="32" y="43" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">ACTION</text>
</svg>
