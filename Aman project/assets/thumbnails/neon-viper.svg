<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="viperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <radialGradient id="appleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#990033"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#080a14"/>
  
  <!-- Cyber Grid Pattern -->
  <g stroke="#141a29" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Glowing Food / Target Orb -->
  <circle cx="430" cy="160" r="28" fill="#ff0055" opacity="0.25"/>
  <circle cx="430" cy="160" r="16" fill="url(#appleGlow)"/>
  <!-- Leaf/Stem -->
  <path d="M430,144 Q435,135 444,136" stroke="#00ff88" stroke-width="3" fill="none"/>

  <!-- Snake Trail Body -->
  <!-- Tail to Head path -->
  <rect x="120" y="270" width="40" height="40" rx="10" fill="#00ff88" opacity="0.4"/>
  <rect x="160" y="270" width="40" height="40" rx="10" fill="#00ff88" opacity="0.55"/>
  <rect x="200" y="270" width="40" height="40" rx="10" fill="#00ff88" opacity="0.7"/>
  <rect x="240" y="270" width="40" height="40" rx="10" fill="#00ff88" opacity="0.8"/>
  <rect x="240" y="230" width="40" height="40" rx="10" fill="#00f0ff" opacity="0.85"/>
  <rect x="240" y="190" width="40" height="40" rx="10" fill="#00f0ff" opacity="0.9"/>
  <rect x="280" y="190" width="40" height="40" rx="10" fill="#00f0ff"/>
  <rect x="320" y="190" width="40" height="40" rx="10" fill="#00f0ff"/>
  <rect x="360" y="190" width="40" height="40" rx="10" fill="#00ff88"/>

  <!-- Snake Head -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#00ff88" stroke="#ffffff" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="14" cy="14" r="5" fill="#000000"/>
    <circle cx="30" cy="14" r="5" fill="#000000"/>
    <circle cx="15" cy="12" r="2" fill="#ffffff"/>
    <circle cx="31" cy="12" r="2" fill="#ffffff"/>
    <!-- Tongue flickering -->
    <path d="M22,0 L22,-12 L17,-18 M22,-12 L27,-18" stroke="#ff007f" stroke-width="2" fill="none"/>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#00ff88" stroke-width="1.5"/>
  <text x="32" y="43" fill="#00ff88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">CASUAL</text>
</svg>
