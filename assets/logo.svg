<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield / Coin -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0d111a" stroke="url(#logoGrad)" stroke-width="4" filter="url(#logoGlow)"/>
  
  <!-- Arcade Joystick Base -->
  <path d="M26 68 L74 68 C76 68 78 66 76 63 L70 54 C69 52 66 50 63 50 L37 50 C34 50 31 52 30 54 L24 63 C22 66 24 68 26 68 Z" fill="#1e293b" stroke="#00f0ff" stroke-width="2.5" />
  
  <!-- Arcade Stick Shaft -->
  <rect x="47" y="28" width="6" height="24" rx="3" fill="#e2e8f0" />
  
  <!-- Joystick Ball Top -->
  <circle cx="50" cy="26" r="14" fill="#ff007f" stroke="#ffffff" stroke-width="2" filter="url(#logoGlow)"/>
  <circle cx="46" cy="22" r="4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Buttons on cabinet -->
  <circle cx="36" cy="59" r="4" fill="#00f0ff" />
  <circle cx="64" cy="59" r="4" fill="#ffe600" />
  
  <!-- D-Pad indicator lines -->
  <path d="M50 74 L50 82 M46 78 L54 78" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
</svg>
