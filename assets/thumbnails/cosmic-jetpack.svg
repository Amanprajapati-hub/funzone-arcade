<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cjpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05051e"/>
      <stop offset="50%" stop-color="#14113c"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cjpSky)"/>

  <!-- Distant Planet / Ring -->
  <circle cx="500" cy="90" r="45" fill="#7928ca" opacity="0.6"/>
  <ellipse cx="500" cy="90" rx="75" ry="16" fill="none" stroke="#ff007f" stroke-width="3" opacity="0.5" transform="rotate(-20 500 90)"/>

  <!-- Electric Laser Gates / Obstacles -->
  <!-- Top Gate -->
  <rect x="420" y="0" width="34" height="150" rx="6" fill="#1e1b4b" stroke="#00f0ff" stroke-width="2"/>
  <line x1="437" y1="150" x2="437" y2="240" stroke="#00f0ff" stroke-width="4" stroke-dasharray="8,6"/>
  <!-- Bottom Gate -->
  <rect x="420" y="240" width="34" height="160" rx="6" fill="#1e1b4b" stroke="#00f0ff" stroke-width="2"/>

  <!-- Floating Star Pickup -->
  <g transform="translate(340, 180) scale(1.4)">
    <polygon points="0,-15 4,-4 15,-4 7,3 10,14 0,7 -10,14 -7,3 -15,-4 -4,-4" fill="url(#starGlow)"/>
  </g>

  <!-- Player Astronaut Jetpack Flyer -->
  <g transform="translate(180, 180)">
    <!-- Jetpack Exhaust Flame & Sparkles -->
    <polygon points="-25,18 -40,32 -25,24 -35,38 -20,24" fill="#ff7700"/>
    <polygon points="-22,18 -32,28 -20,22" fill="#ffe600"/>
    <circle cx="-42" cy="36" r="3" fill="#ffe600"/>
    <circle cx="-50" cy="44" r="2" fill="#ff007f"/>

    <!-- Jetpack Tank -->
    <rect x="-24" y="-8" width="14" height="30" rx="6" fill="#475569" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Astronaut Body -->
    <ellipse cx="6" cy="10" rx="18" ry="20" fill="#f8fafc"/>
    <rect x="-4" y="2" width="16" height="14" rx="4" fill="#3b82f6"/>

    <!-- Helmet & Visor -->
    <circle cx="8" cy="-14" r="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="14" cy="-14" rx="12" ry="10" fill="#00f0ff"/>
    <ellipse cx="18" cy="-17" rx="4" ry="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#00ff88" stroke-width="1.5"/>
  <text x="32" y="43" fill="#00ff88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">CASUAL</text>
</svg>
