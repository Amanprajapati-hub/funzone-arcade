<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b001a"/>
      <stop offset="50%" stop-color="#2d004d"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="cdSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="cdCar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="230" fill="url(#cdSky)"/>
  
  <!-- Synthwave Sun -->
  <circle cx="300" cy="180" r="90" fill="url(#cdSun)"/>
  <rect x="200" y="150" width="200" height="4" fill="#0b001a"/>
  <rect x="205" y="162" width="190" height="6" fill="#0b001a"/>
  <rect x="215" y="176" width="170" height="8" fill="#0b001a"/>
  <rect x="230" y="192" width="140" height="10" fill="#0b001a"/>
  
  <!-- Ground Horizon & Grid -->
  <rect y="230" width="600" height="170" fill="#050510"/>
  <!-- Perspective Road -->
  <polygon points="260,230 340,230 520,400 80,400" fill="#0f1123" stroke="#ff007f" stroke-width="2"/>
  <!-- Road lanes -->
  <line x1="287" y1="230" x2="230" y2="400" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16,12"/>
  <line x1="313" y1="230" x2="370" y2="400" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16,12"/>
  <!-- Road borders glow -->
  <line x1="260" y1="230" x2="80" y2="400" stroke="#ff007f" stroke-width="4"/>
  <line x1="340" y1="230" x2="520" y2="400" stroke="#ff007f" stroke-width="4"/>
  
  <!-- Cyber Sports Car -->
  <g transform="translate(245, 290)">
    <!-- Exhaust Glow -->
    <ellipse cx="25" cy="72" rx="12" ry="6" fill="#00f0ff" opacity="0.8"/>
    <ellipse cx="85" cy="72" rx="12" ry="6" fill="#00f0ff" opacity="0.8"/>
    <polygon points="15,70 95,70 85,55 25,55" fill="#1e1e38"/>
    <!-- Car body rear -->
    <path d="M10,65 L100,65 L90,35 L20,35 Z" fill="url(#cdCar)"/>
    <!-- Cockpit / Roof -->
    <polygon points="30,35 80,35 72,15 38,15" fill="#001833" stroke="#00f0ff" stroke-width="2"/>
    <!-- Tail light neon bar -->
    <rect x="18" y="50" width="74" height="6" rx="3" fill="#ff0055"/>
    <!-- Wheels -->
    <rect x="2" y="55" width="12" height="22" rx="4" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="96" y="55" width="12" height="22" rx="4" fill="#0a0a14" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="18" y="25" width="8" height="15" rx="3" fill="#0a0a14"/>
    <rect x="84" y="25" width="8" height="15" rx="3" fill="#0a0a14"/>
  </g>
  
  <!-- Title Badge -->
  <rect x="20" y="20" width="140" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#ff007f" stroke-width="1.5"/>
  <text x="32" y="43" fill="#ff007f" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">RACING</text>
  <text x="440" y="44" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">TOP SPEED</text>
</svg>
