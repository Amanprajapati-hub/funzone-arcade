<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grassGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#grassGrad)"/>

  <!-- Curved Race Track -->
  <path d="M-50,380 Q300,380 400,200 Q500,20 650,20" stroke="#1e2238" stroke-width="140" fill="none"/>
  <!-- Track Curbs / Rumble Strips -->
  <path d="M-50,310 Q250,310 330,200 Q410,90 650,90" stroke="#ff007f" stroke-width="6" stroke-dasharray="14,14" fill="none"/>
  <path d="M-50,450 Q350,450 470,200 Q590,-50 650,-50" stroke="#00f0ff" stroke-width="6" stroke-dasharray="14,14" fill="none"/>

  <!-- Skid Marks from Drifting -->
  <path d="M120,360 Q220,360 270,300 Q310,250 350,230" stroke="#000000" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M150,380 Q250,380 300,320 Q340,270 380,250" stroke="#000000" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Drift Smoke & Sparks -->
  <circle cx="280" cy="300" r="16" fill="#00f0ff" opacity="0.35"/>
  <circle cx="310" cy="275" r="22" fill="#ffffff" opacity="0.4"/>
  <circle cx="250" cy="320" r="14" fill="#00f0ff" opacity="0.25"/>

  <!-- Drift Car (Angled / Drifting) -->
  <g transform="translate(320, 240) rotate(-35)">
    <!-- Wheels -->
    <rect x="-24" y="-36" width="10" height="18" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="14" y="-36" width="10" height="18" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="-24" y="18" width="10" height="18" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="14" y="18" width="10" height="18" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    
    <!-- Body Chassis -->
    <rect x="-18" y="-40" width="36" height="80" rx="10" fill="url(#carBody)" stroke="#ffffff" stroke-width="2"/>
    <!-- Racing Stripes -->
    <rect x="-4" y="-40" width="8" height="80" fill="#ffffff" opacity="0.9"/>
    
    <!-- Windshield -->
    <polygon points="-12,-15 12,-15 10,-5 -10,-5" fill="#090d16"/>
    <!-- Rear Window -->
    <polygon points="-10,18 10,18 12,26 -12,26" fill="#090d16"/>
    <!-- Spoiler -->
    <rect x="-18" y="34" width="36" height="6" rx="2" fill="#000000" stroke="#ff0055" stroke-width="1"/>
  </g>

  <!-- Speed lines -->
  <line x1="390" y1="200" x2="480" y2="150" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,8" opacity="0.8"/>
  <line x1="380" y1="230" x2="470" y2="180" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,8" opacity="0.6"/>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#ff7700" stroke-width="1.5"/>
  <text x="32" y="43" fill="#ff7700" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">RACING</text>
</svg>
