<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140b2e"/>
      <stop offset="100%" stop-color="#03000a"/>
    </radialGradient>
    <linearGradient id="laserGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="alienGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#spaceBg)"/>
  
  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="180" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="520" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="480" cy="300" r="2.5" fill="#ff007f" opacity="0.5"/>
  <circle cx="90" cy="340" r="1.2" fill="#ffffff"/>
  <circle cx="390" cy="120" r="1.8" fill="#ffe600"/>
  
  <!-- Enemy Alien Ships -->
  <g transform="translate(140, 80) scale(0.8)">
    <polygon points="40,10 60,35 50,45 40,35 30,45 20,35" fill="url(#alienGrad)"/>
    <circle cx="40" cy="25" r="5" fill="#ffe600"/>
  </g>
  <g transform="translate(390, 80) scale(0.8)">
    <polygon points="40,10 60,35 50,45 40,35 30,45 20,35" fill="url(#alienGrad)"/>
    <circle cx="40" cy="25" r="5" fill="#ffe600"/>
  </g>
  <g transform="translate(260, 50) scale(1.1)">
    <!-- Boss / Elite Enemy -->
    <polygon points="50,10 80,45 65,65 50,55 35,65 20,45" fill="#ff0055" stroke="#ffea00" stroke-width="2"/>
    <circle cx="50" cy="35" r="8" fill="#ffea00"/>
    <line x1="20" y1="45" x2="10" y2="60" stroke="#ff0055" stroke-width="3"/>
    <line x1="80" y1="45" x2="90" y2="60" stroke="#ff0055" stroke-width="3"/>
  </g>

  <!-- Laser Beams -->
  <line x1="275" y1="310" x2="275" y2="120" stroke="url(#laserGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="325" y1="310" x2="325" y2="120" stroke="url(#laserGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Player Fighter Ship -->
  <g transform="translate(260, 270)">
    <!-- Thruster Flame -->
    <polygon points="35,100 40,125 45,100" fill="#00f0ff" opacity="0.9"/>
    <polygon points="37,100 40,118 43,100" fill="#ffffff"/>
    
    <!-- Wings -->
    <polygon points="40,30 5,80 15,95 40,85 65,85 75,95 85,80" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <!-- Wing Cannons -->
    <rect x="3" y="60" width="5" height="25" rx="2" fill="#00f0ff"/>
    <rect x="82" y="60" width="5" height="25" rx="2" fill="#00f0ff"/>
    <!-- Fuselage Body -->
    <polygon points="40,10 52,70 40,88 28,70" fill="#00f0ff"/>
    <!-- Cockpit -->
    <polygon points="40,25 45,55 35,55" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="32" y="43" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">ACTION</text>
</svg>
