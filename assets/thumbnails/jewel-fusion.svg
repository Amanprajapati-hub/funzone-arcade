<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="jfBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="100%" stop-color="#080210"/>
    </radialGradient>
    <!-- Ruby Diamond -->
    <linearGradient id="rubyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <!-- Sapphire Gem -->
    <linearGradient id="sapphireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>
    <!-- Emerald Gem -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#008844"/>
    </linearGradient>
    <!-- Topaz Gem -->
    <linearGradient id="topazGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#jfBg)"/>

  <!-- Subtle Puzzle Grid Slot Backgrounds -->
  <g fill="#160e28" stroke="#372458" stroke-width="1.5">
    <rect x="140" y="70" width="70" height="70" rx="12"/>
    <rect x="220" y="70" width="70" height="70" rx="12"/>
    <rect x="300" y="70" width="70" height="70" rx="12"/>
    <rect x="380" y="70" width="70" height="70" rx="12"/>
    <rect x="140" y="150" width="70" height="70" rx="12"/>
    <rect x="220" y="150" width="70" height="70" rx="12"/>
    <rect x="300" y="150" width="70" height="70" rx="12"/>
    <rect x="380" y="150" width="70" height="70" rx="12"/>
    <rect x="140" y="230" width="70" height="70" rx="12"/>
    <rect x="220" y="230" width="70" height="70" rx="12"/>
    <rect x="300" y="230" width="70" height="70" rx="12"/>
    <rect x="380" y="230" width="70" height="70" rx="12"/>
  </g>

  <!-- Gem: Topaz Hexagon -->
  <polygon points="175,82 198,95 198,115 175,128 152,115 152,95" fill="url(#topazGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Gem: Sapphire Octagon -->
  <polygon points="240,82 270,82 280,95 280,115 270,128 240,128 230,115 230,95" fill="url(#sapphireGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Gem: Emerald Triangle -->
  <polygon points="335,82 355,125 315,125" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- MATCH-3 ROW of Glowing Rubies with Energy Burst -->
  <!-- Ruby 1 -->
  <polygon points="175,158 198,185 175,212 152,185" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="2"/>
  <!-- Ruby 2 (Center Combo) -->
  <polygon points="255,158 278,185 255,212 232,185" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Ruby 3 -->
  <polygon points="335,158 358,185 335,212 312,185" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="2"/>

  <!-- Match Burst Beam & Sparkles -->
  <line x1="145" y1="185" x2="365" y2="185" stroke="#ff3366" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="145" y1="185" x2="365" y2="185" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Star Sparkles -->
  <polygon points="255,170 258,182 270,185 258,188 255,200 252,188 240,185 252,182" fill="#ffffff"/>
  <polygon points="340,150 342,158 350,160 342,162 340,170 338,162 330,160 338,158" fill="#ffe600"/>

  <!-- Bottom Gems -->
  <polygon points="175,242 198,255 198,275 175,288 152,275 152,255" fill="url(#sapphireGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="255,238 278,265 255,292 232,265" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="335,242 358,255 358,275 335,288 312,275 312,255" fill="url(#topazGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#a855f7" stroke-width="1.5"/>
  <text x="32" y="43" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">PUZZLE</text>
</svg>
