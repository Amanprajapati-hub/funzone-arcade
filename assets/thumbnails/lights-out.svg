
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f20"/>
      <stop offset="100%" stop-color="#15112b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" rx="14" fill="url(#bg)"/>
  <rect x="105" y="35" width="190" height="150" rx="10"
        fill="#101b35" stroke="#42e8ff" stroke-width="3"/>
  <g stroke="#42e8ff" stroke-width="2">
    <circle cx="140" cy="70" r="17" fill="#ffd166" filter="url(#glow)"/>
    <circle cx="200" cy="70" r="17" fill="#182b50"/>
    <circle cx="260" cy="70" r="17" fill="#182b50"/>
    <circle cx="140" cy="120" r="17" fill="#182b50"/>
    <circle cx="200" cy="120" r="17" fill="#ffd166" filter="url(#glow)"/>
    <circle cx="260" cy="120" r="17" fill="#182b50"/>
    <circle cx="140" cy="160" r="17" fill="#182b50"/>
    <circle cx="200" cy="160" r="17" fill="#182b50"/>
    <circle cx="260" cy="160" r="17" fill="#ffd166" filter="url(#glow)"/>
  </g>
  <text x="200" y="215" text-anchor="middle" fill="#f5f7ff"
        font-family="Arial" font-size="19" font-weight="bold" letter-spacing="3">
    LIGHTS OUT
  </text>
</svg>
