<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05051a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tsBg)"/>

  <!-- Starry sky particles -->
  <circle cx="80" cy="120" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="500" cy="80" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="520" cy="280" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="100" cy="290" r="1.5" fill="#ff007f" opacity="0.6"/>

  <!-- Glowing Tower Stack Blocks (Isometric / Flat 3D style) -->
  
  <!-- Base Block 1 (Deep Blue / Violet) -->
  <g transform="translate(160, 310)">
    <rect x="0" y="0" width="280" height="32" rx="4" fill="#6366f1" stroke="#a5b4fc" stroke-width="1.5"/>
    <!-- Top highlight edge -->
    <line x1="0" y1="2" x2="280" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Block 2 (Cyan) -->
  <g transform="translate(170, 274)">
    <rect x="0" y="0" width="260" height="32" rx="4" fill="#06b6d4" stroke="#67e8f9" stroke-width="1.5"/>
    <line x1="0" y1="2" x2="260" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Block 3 (Emerald Green) -->
  <g transform="translate(185, 238)">
    <rect x="0" y="0" width="230" height="32" rx="4" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5"/>
    <line x1="0" y1="2" x2="230" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Block 4 (Yellow) -->
  <g transform="translate(195, 202)">
    <rect x="0" y="0" width="210" height="32" rx="4" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="0" y1="2" x2="210" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Block 5 (Orange) -->
  <g transform="translate(205, 166)">
    <rect x="0" y="0" width="190" height="32" rx="4" fill="#f97316" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="0" y1="2" x2="190" y2="2" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Block 6 (Moving Top Block - Magenta / Pink) Sliding in -->
  <g transform="translate(250, 130)">
    <rect x="0" y="0" width="190" height="32" rx="4" fill="#ec4899" stroke="#fbcfe8" stroke-width="2"/>
    <line x1="0" y1="2" x2="190" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Sliced falling piece from previous drop -->
  <g transform="translate(400, 190) rotate(15)">
    <rect x="0" y="0" width="30" height="28" rx="3" fill="#f97316" opacity="0.6"/>
  </g>
  <circle cx="415" cy="225" r="3" fill="#ff7700" opacity="0.7"/>
  <circle cx="425" cy="245" r="2" fill="#ffe600" opacity="0.5"/>

  <!-- Motion Trails for moving top block -->
  <line x1="200" y1="146" x2="245" y2="146" stroke="#ec4899" stroke-width="3" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Category Badge -->
  <rect x="20" y="20" width="130" height="34" rx="8" fill="#000000" fill-opacity="0.7" stroke="#00ff88" stroke-width="1.5"/>
  <text x="32" y="43" fill="#00ff88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="1">CASUAL</text>
</svg>
